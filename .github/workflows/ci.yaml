name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Create test.conf
        run: |
          echo "key=${{ secrets.login }}" > src/test/resources/config.properties
          echo "token=${{ secrets.password }}" >> src/test/resources/config.properties
          echo "remote.url=http://selenium-hub:4444/wd/hub" >> src/test/resources/test.conf
          echo "headless=true" >> src/test/resources/test.conf


      - name: Build Docker image
        run: docker-compose build

      - name: Run tests in Docker
        run: docker-compose up --abort-on-container-exit

      - name: Attach screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
            name: screenshots
            path: ${{ github.workspace }}/screenshots

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
              allure_results: target/allure-results
              gh_pages: gh-pages
              allure_report: allure-report
              allure_history: allure-history

      - name: Check Allure results
        run: ls -la target/allure-results

      - name: Publish Allure report to Github Pages
        if: ${{ success() || failure() }}
        uses: peaceiris/actions-gh-pages@v2
        env:
              PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              PUBLISH_BRANCH: gh-pages
              PUBLISH_DIR: allure-history

      - name: Stop Docker Compose services
        if: always()
        run: docker-compose down